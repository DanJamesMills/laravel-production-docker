[www]
user  = www-data
group = www-data

; TCP - required for cross-container communication with nginx
listen = 9000

; Dynamic process manager - scales workers up and down with demand
pm = dynamic

; Maximum child processes.
; Formula: (container_memory_limit_MB - 256) / avg_worker_MB
; Default container limit is 2GB: (2048 - 256) / 80MB ≈ 22, use 20 for safety.
; Increase this value if you raise the PHP container memory limit in docker-compose.yml
pm.max_children = 20

; Workers started on boot
pm.start_servers = 5

; Always keep at least this many idle workers ready
pm.min_spare_servers = 5

; Kill idle workers above this count to save memory
pm.max_spare_servers = 15

; Recycle each worker after N requests to prevent slow memory leaks
pm.max_requests = 500

; Kill idle workers after this many seconds of inactivity
pm.process_idle_timeout = 10s

; Expose FPM status page (accessible only from localhost via nginx)
pm.status_path = /fpm-status

; Log requests that take longer than this
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s

; Hard kill requests that exceed this time (matches PHP max_execution_time)
request_terminate_timeout = 300s

; Pass host environment variables through to PHP workers
clear_env = no

; Catch output from workers and forward to container stdout/stderr
catch_workers_output = yes
decorate_workers_output = no
